<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invader Game</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b10;
      --panel: #111820;
      --line: #263543;
      --text: #edf7ff;
      --muted: #8ea3b2;
      --accent: #35d07f;
      --warn: #ffcb3d;
      --danger: #ff5672;
      --cyan: #37c8ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 0%, rgba(55, 200, 255, 0.14), transparent 32rem),
        linear-gradient(180deg, #0b1016 0%, var(--bg) 70%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .shell {
      width: min(100%, 980px);
      display: grid;
      gap: 12px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 3vw, 2.2rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .status {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      font-size: 0.92rem;
    }

    .pill {
      min-width: 86px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(17, 24, 32, 0.8);
      text-align: center;
    }

    .pill strong {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      min-height: 360px;
      max-height: min(74vh, 720px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #05070b;
      box-shadow: 0 22px 80px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(5, 7, 11, 0.68);
      backdrop-filter: blur(2px);
    }

    .dialog {
      width: min(100%, 410px);
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(17, 24, 32, 0.94);
      text-align: center;
    }

    .dialog h2 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    .dialog p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #041007;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      padding: 11px 18px;
    }

    button:focus-visible {
      outline: 3px solid var(--cyan);
      outline-offset: 3px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(72px, 1fr));
      gap: 10px;
    }

    .controls button {
      min-height: 48px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      user-select: none;
    }

    .controls button:last-child {
      color: #071106;
      background: var(--warn);
    }

    .hint {
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
    }

    .hidden {
      display: none;
    }

    @media (min-width: 760px) {
      .controls {
        display: none;
      }
    }

    @media (max-width: 580px) {
      body {
        padding: 10px;
      }

      header {
        align-items: stretch;
        flex-direction: column;
      }

      .status {
        justify-content: stretch;
      }

      .pill {
        flex: 1 1 30%;
      }

      .stage {
        min-height: 420px;
        aspect-ratio: 9 / 13;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>INVADER</h1>
      <div class="status" aria-live="polite">
        <div class="pill">SCORE <strong id="score">0</strong></div>
        <div class="pill">LEVEL <strong id="level">1</strong></div>
        <div class="pill">LIFE <strong id="lives">3</strong></div>
      </div>
    </header>

    <section class="stage" id="stage" aria-label="インベーダーゲーム">
      <canvas id="game" width="800" height="600"></canvas>
      <div class="overlay" id="overlay">
        <div class="dialog">
          <h2 id="overlayTitle">READY</h2>
          <p id="overlayText">← → または A/D で移動、Space でショット。敵が下まで来る前に全部倒そう。</p>
          <button id="startButton">START</button>
        </div>
      </div>
    </section>

    <div class="controls" aria-label="タッチ操作">
      <button id="leftButton" aria-label="左へ移動">◀</button>
      <button id="rightButton" aria-label="右へ移動">▶</button>
      <button id="fireButton" aria-label="ショット">SHOT</button>
    </div>
    <div class="hint">操作: ← → / A D で移動、Space / Enter でショット、P で一時停止</div>
  </main>

  <script>
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const stage = document.querySelector("#stage");
    const overlay = document.querySelector("#overlay");
    const overlayTitle = document.querySelector("#overlayTitle");
    const overlayText = document.querySelector("#overlayText");
    const startButton = document.querySelector("#startButton");
    const scoreEl = document.querySelector("#score");
    const levelEl = document.querySelector("#level");
    const livesEl = document.querySelector("#lives");

    const keys = new Set();
    const touchState = { left: false, right: false, fire: false };
    const state = {
      running: false,
      paused: false,
      over: false,
      score: 0,
      level: 1,
      lives: 3,
      lastTime: 0,
      shotCooldown: 0,
      enemyShotTimer: 1.25,
      shake: 0
    };

    const audio = {
      context: null,
      enabled: true,
      unlocked: false
    };

    const player = {
      x: 400,
      y: 548,
      width: 46,
      height: 22,
      speed: 430,
      invincible: 0
    };

    let stars = [];
    let enemies = [];
    let playerBullets = [];
    let enemyBullets = [];
    let particles = [];
    let fleet = { dir: 1, speed: 42, drop: 22 };

    function resizeCanvas() {
      const rect = stage.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.floor(rect.width * ratio);
      canvas.height = Math.floor(rect.height * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      canvas.logicalWidth = rect.width;
      canvas.logicalHeight = rect.height;
      player.y = canvas.logicalHeight - 52;
      player.x = clamp(player.x, 28, canvas.logicalWidth - 28);
      createStars();
    }

    function createStars() {
      const width = canvas.logicalWidth || 800;
      const height = canvas.logicalHeight || 600;
      stars = Array.from({ length: 95 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.4 + 0.4,
        s: Math.random() * 28 + 10,
        a: Math.random() * 0.65 + 0.2
      }));
    }

    function buildLevel() {
      const width = canvas.logicalWidth || 800;
      const cols = Math.min(11, Math.max(7, Math.floor(width / 64)));
      const rows = Math.min(5, 3 + Math.floor(state.level / 2));
      const startX = (width - (cols - 1) * 54) / 2;
      const startY = 58;
      enemies = [];
      for (let row = 0; row < rows; row += 1) {
        for (let col = 0; col < cols; col += 1) {
          enemies.push({
            x: startX + col * 54,
            y: startY + row * 42,
            width: 34,
            height: 24,
            row,
            phase: Math.random() * Math.PI * 2,
            alive: true
          });
        }
      }
      fleet = {
        dir: 1,
        speed: 34 + state.level * 9,
        drop: 18 + Math.min(10, state.level * 2)
      };
      enemyShotTimer = Math.max(0.45, 1.35 - state.level * 0.08);
    }

    function resetGame() {
      unlockAudio();
      playSound("start");
      state.running = true;
      state.paused = false;
      state.over = false;
      state.score = 0;
      state.level = 1;
      state.lives = 3;
      state.lastTime = performance.now();
      state.shotCooldown = 0;
      state.enemyShotTimer = 1.15;
      state.shake = 0;
      player.x = (canvas.logicalWidth || 800) / 2;
      player.invincible = 1.6;
      playerBullets = [];
      enemyBullets = [];
      particles = [];
      buildLevel();
      updateHud();
      hideOverlay();
      requestAnimationFrame(loop);
    }

    function updateHud() {
      scoreEl.textContent = state.score;
      levelEl.textContent = state.level;
      livesEl.textContent = state.lives;
    }

    function showOverlay(title, text, buttonText = "RESTART") {
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      startButton.textContent = buttonText;
      overlay.classList.remove("hidden");
    }

    function hideOverlay() {
      overlay.classList.add("hidden");
    }

    function loop(time) {
      const dt = Math.min(0.033, (time - state.lastTime) / 1000 || 0);
      state.lastTime = time;
      if (state.running && !state.paused) update(dt);
      draw();
      if (state.running) requestAnimationFrame(loop);
    }

    function update(dt) {
      const width = canvas.logicalWidth;
      const height = canvas.logicalHeight;
      const movingLeft = keys.has("ArrowLeft") || keys.has("a") || keys.has("A") || touchState.left;
      const movingRight = keys.has("ArrowRight") || keys.has("d") || keys.has("D") || touchState.right;
      const firing = keys.has(" ") || keys.has("Enter") || touchState.fire;

      if (movingLeft) player.x -= player.speed * dt;
      if (movingRight) player.x += player.speed * dt;
      player.x = clamp(player.x, player.width / 2 + 8, width - player.width / 2 - 8);

      state.shotCooldown -= dt;
      player.invincible = Math.max(0, player.invincible - dt);
      state.shake = Math.max(0, state.shake - dt * 18);

      if (firing && state.shotCooldown <= 0) {
        playerBullets.push({ x: player.x, y: player.y - 17, vy: -620, width: 5, height: 16 });
        state.shotCooldown = 0.22;
        playSound("shoot");
      }

      for (const star of stars) {
        star.y += star.s * dt;
        if (star.y > height) {
          star.y = -2;
          star.x = Math.random() * width;
        }
      }

      updateFleet(dt, width);
      updateBullets(dt, height);
      updateParticles(dt);
      handleCollisions();

      state.enemyShotTimer -= dt;
      if (state.enemyShotTimer <= 0 && enemies.length) {
        enemyFire();
        state.enemyShotTimer = Math.max(0.32, 1.4 - state.level * 0.08) * (0.65 + Math.random() * 0.7);
      }

      if (enemies.some(enemy => enemy.y + enemy.height / 2 >= player.y - 8)) {
        loseLife();
      }

      if (enemies.length === 0) {
        state.level += 1;
        player.invincible = 1.4;
        playerBullets = [];
        enemyBullets = [];
        buildLevel();
        updateHud();
      }
    }

    function updateFleet(dt, width) {
      if (!enemies.length) return;
      let minX = Infinity;
      let maxX = -Infinity;
      for (const enemy of enemies) {
        minX = Math.min(minX, enemy.x - enemy.width / 2);
        maxX = Math.max(maxX, enemy.x + enemy.width / 2);
      }
      const nextMin = minX + fleet.dir * fleet.speed * dt;
      const nextMax = maxX + fleet.dir * fleet.speed * dt;
      let shouldDrop = false;
      if (nextMin <= 14 || nextMax >= width - 14) {
        fleet.dir *= -1;
        shouldDrop = true;
      }
      for (const enemy of enemies) {
        enemy.x += fleet.dir * fleet.speed * dt;
        enemy.phase += dt * 6;
        if (shouldDrop) enemy.y += fleet.drop;
      }
    }

    function updateBullets(dt, height) {
      for (const bullet of playerBullets) bullet.y += bullet.vy * dt;
      for (const bullet of enemyBullets) bullet.y += bullet.vy * dt;
      playerBullets = playerBullets.filter(bullet => bullet.y + bullet.height > 0);
      enemyBullets = enemyBullets.filter(bullet => bullet.y - bullet.height < height + 24);
    }

    function updateParticles(dt) {
      for (const particle of particles) {
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        particle.life -= dt;
      }
      particles = particles.filter(particle => particle.life > 0);
    }

    function handleCollisions() {
      for (const bullet of playerBullets) {
        if (bullet.hit) continue;
        for (const enemy of enemies) {
          if (rectsOverlap(bullet, enemy)) {
            bullet.hit = true;
            enemy.hit = true;
            state.score += 10 + enemy.row * 5;
            burst(enemy.x, enemy.y, "#35d07f", 14);
            playSound("hit");
            break;
          }
        }
      }
      enemies = enemies.filter(enemy => !enemy.hit);
      playerBullets = playerBullets.filter(bullet => !bullet.hit);

      if (player.invincible <= 0) {
        for (const bullet of enemyBullets) {
          if (rectsOverlap(bullet, player)) {
            bullet.hit = true;
            loseLife();
            break;
          }
        }
      }
      enemyBullets = enemyBullets.filter(bullet => !bullet.hit);
      updateHud();
    }

    function enemyFire() {
      const columns = new Map();
      for (const enemy of enemies) {
        const key = Math.round(enemy.x / 18);
        const current = columns.get(key);
        if (!current || enemy.y > current.y) columns.set(key, enemy);
      }
      const shooters = [...columns.values()];
      const shooter = shooters[Math.floor(Math.random() * shooters.length)];
      enemyBullets.push({
        x: shooter.x,
        y: shooter.y + shooter.height / 2,
        vy: 180 + state.level * 24,
        width: 6,
        height: 15
      });
    }

    function loseLife() {
      state.lives -= 1;
      state.shake = 8;
      player.invincible = 1.8;
      enemyBullets = [];
      playerBullets = [];
      burst(player.x, player.y, "#ff5672", 24);
      updateHud();
      if (state.lives <= 0) {
        state.running = false;
        state.over = true;
        draw();
        playSound("gameOver");
        showOverlay("GAME OVER", `スコア ${state.score}。もう一度、地球を守ろう。`);
      } else {
        playSound("damage");
        player.x = (canvas.logicalWidth || 800) / 2;
        buildLevel();
      }
    }

    function unlockAudio() {
      if (!audio.enabled) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) {
        audio.enabled = false;
        return;
      }
      if (!audio.context) audio.context = new AudioContext();
      if (audio.context.state === "suspended") audio.context.resume();
      audio.unlocked = true;
    }

    function playSound(type) {
      if (!audio.enabled) return;
      unlockAudio();
      const context = audio.context;
      if (!context || context.state !== "running") return;
      if (type === "shoot") tone(720, 0.055, "square", 0.045, -160);
      if (type === "hit") {
        tone(210, 0.06, "sawtooth", 0.06, 110);
        noise(0.09, 0.045);
      }
      if (type === "damage") {
        tone(120, 0.22, "triangle", 0.11, -80);
        noise(0.16, 0.065);
      }
      if (type === "gameOver") {
        tone(190, 0.28, "sawtooth", 0.09, -90);
        setTimeout(() => tone(95, 0.36, "sawtooth", 0.08, -30), 140);
      }
      if (type === "start") {
        tone(330, 0.09, "square", 0.04, 120);
        setTimeout(() => tone(520, 0.1, "square", 0.04, 100), 80);
      }
    }

    function tone(frequency, duration, wave, volume, slide) {
      const context = audio.context;
      const now = context.currentTime;
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      oscillator.type = wave;
      oscillator.frequency.setValueAtTime(frequency, now);
      oscillator.frequency.exponentialRampToValueAtTime(Math.max(20, frequency + slide), now + duration);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      oscillator.connect(gain);
      gain.connect(context.destination);
      oscillator.start(now);
      oscillator.stop(now + duration + 0.02);
    }

    function noise(duration, volume) {
      const context = audio.context;
      const buffer = context.createBuffer(1, context.sampleRate * duration, context.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i += 1) data[i] = Math.random() * 2 - 1;
      const source = context.createBufferSource();
      const gain = context.createGain();
      gain.gain.setValueAtTime(volume, context.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + duration);
      source.buffer = buffer;
      source.connect(gain);
      gain.connect(context.destination);
      source.start();
    }

    function burst(x, y, color, count) {
      for (let i = 0; i < count; i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 180 + 60;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: Math.random() * 0.45 + 0.25,
          color
        });
      }
    }

    function draw() {
      const width = canvas.logicalWidth || 800;
      const height = canvas.logicalHeight || 600;
      ctx.clearRect(0, 0, width, height);
      ctx.save();
      if (state.shake > 0) {
        ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
      }
      drawBackground(width, height);
      drawBullets();
      drawEnemies();
      drawPlayer();
      drawParticles();
      ctx.restore();

      if (state.paused) {
        ctx.fillStyle = "rgba(5, 7, 11, 0.56)";
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "#edf7ff";
        ctx.font = "800 34px Segoe UI, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("PAUSE", width / 2, height / 2);
      }
    }

    function drawBackground(width, height) {
      ctx.fillStyle = "#05070b";
      ctx.fillRect(0, 0, width, height);
      for (const star of stars) {
        ctx.globalAlpha = star.a;
        ctx.fillStyle = "#d8fbff";
        ctx.fillRect(star.x, star.y, star.r, star.r);
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(53, 208, 127, 0.16)";
      ctx.fillRect(0, height - 28, width, 2);
    }

    function drawPlayer() {
      const blink = player.invincible > 0 && Math.floor(performance.now() / 90) % 2 === 0;
      if (blink) return;
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.fillStyle = "#37c8ff";
      ctx.fillRect(-23, 2, 46, 12);
      ctx.fillRect(-13, -9, 26, 13);
      ctx.fillRect(-4, -18, 8, 12);
      ctx.fillStyle = "#edf7ff";
      ctx.fillRect(-7, -5, 14, 5);
      ctx.restore();
    }

    function drawEnemies() {
      for (const enemy of enemies) {
        ctx.save();
        ctx.translate(enemy.x, enemy.y);
        const wiggle = Math.sin(enemy.phase) > 0 ? 2 : -2;
        ctx.fillStyle = enemy.row % 2 ? "#ffcb3d" : "#35d07f";
        ctx.fillRect(-15, -10, 30, 20);
        ctx.fillRect(-22, -2, 44, 12);
        ctx.clearRect(-9, -5, 5, 5);
        ctx.clearRect(5, -5, 5, 5);
        ctx.fillStyle = "#05070b";
        ctx.fillRect(-8, -4, 4, 4);
        ctx.fillRect(5, -4, 4, 4);
        ctx.fillStyle = enemy.row % 2 ? "#ffcb3d" : "#35d07f";
        ctx.fillRect(-20 + wiggle, 14, 8, 5);
        ctx.fillRect(12 - wiggle, 14, 8, 5);
        ctx.restore();
      }
    }

    function drawBullets() {
      ctx.fillStyle = "#edf7ff";
      for (const bullet of playerBullets) {
        ctx.fillRect(bullet.x - bullet.width / 2, bullet.y - bullet.height / 2, bullet.width, bullet.height);
      }
      ctx.fillStyle = "#ff5672";
      for (const bullet of enemyBullets) {
        ctx.fillRect(bullet.x - bullet.width / 2, bullet.y - bullet.height / 2, bullet.width, bullet.height);
      }
    }

    function drawParticles() {
      for (const particle of particles) {
        ctx.globalAlpha = Math.max(0, particle.life * 2.2);
        ctx.fillStyle = particle.color;
        ctx.fillRect(particle.x, particle.y, 4, 4);
      }
      ctx.globalAlpha = 1;
    }

    function rectsOverlap(a, b) {
      const ax = a.x - a.width / 2;
      const ay = a.y - a.height / 2;
      const bx = b.x - b.width / 2;
      const by = b.y - b.height / 2;
      return ax < bx + b.width && ax + a.width > bx && ay < by + b.height && ay + a.height > by;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function togglePause() {
      if (!state.running || state.over) return;
      state.paused = !state.paused;
      if (!state.paused) {
        state.lastTime = performance.now();
        requestAnimationFrame(loop);
      } else {
        draw();
      }
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("keydown", event => {
      if (["ArrowLeft", "ArrowRight", " ", "Enter"].includes(event.key)) event.preventDefault();
      if (event.key === "p" || event.key === "P") {
        togglePause();
        return;
      }
      keys.add(event.key);
    });
    window.addEventListener("keyup", event => keys.delete(event.key));
    startButton.addEventListener("click", resetGame);

    function bindTouchButton(id, key) {
      const button = document.querySelector(id);
      const set = value => {
        touchState[key] = value;
      };
      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        set(true);
      });
      button.addEventListener("pointerup", () => set(false));
      button.addEventListener("pointercancel", () => set(false));
      button.addEventListener("pointerleave", () => set(false));
    }

    bindTouchButton("#leftButton", "left");
    bindTouchButton("#rightButton", "right");
    bindTouchButton("#fireButton", "fire");

    resizeCanvas();
    draw();
  </script>
</body>
</html>
