<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Breaker</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111316;
      --panel: #1c2228;
      --line: #37424d;
      --text: #eef4f7;
      --muted: #a6b2ba;
      --amber: #f5b84b;
      --cyan: #50c7d8;
      --red: #e45f67;
      --green: #71c671;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      background:
        radial-gradient(circle at 22% 18%, rgba(80, 199, 216, .16), transparent 30%),
        linear-gradient(150deg, #111316 0%, #17191d 48%, #20211b 100%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .shell {
      width: min(100%, 1040px);
      display: grid;
      grid-template-columns: minmax(320px, 760px) 250px;
      gap: 18px;
      align-items: stretch;
    }

    .game-frame {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 8px;
      background: #080b0f;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .38);
      aspect-ratio: 4 / 3;
      min-height: 360px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: none;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(8, 11, 15, .72);
      opacity: 1;
      transition: opacity .18s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .start-panel {
      width: min(92%, 420px);
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 8px;
      background: rgba(28, 34, 40, .92);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 6vw, 4.3rem);
      line-height: .94;
      letter-spacing: 0;
    }

    .lead {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.55;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 11px 16px;
      background: var(--amber);
      color: #16120a;
      font: 700 15px/1 "Segoe UI", system-ui, sans-serif;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid rgba(80, 199, 216, .72);
      outline-offset: 3px;
    }

    .side {
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 8px;
      background: rgba(28, 34, 40, .82);
      padding: 16px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 14px;
      min-height: 360px;
    }

    .brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .brand strong {
      font-size: 18px;
    }

    .status {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .stat {
      min-height: 66px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 8px;
      background: rgba(255, 255, 255, .045);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .stat b {
      display: block;
      margin-top: 5px;
      font-size: 24px;
      line-height: 1;
    }

    .help {
      align-self: start;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .help kbd {
      display: inline-grid;
      place-items: center;
      min-width: 24px;
      height: 22px;
      padding: 0 6px;
      border: 1px solid var(--line);
      border-bottom-color: #20262c;
      border-radius: 4px;
      background: #11161b;
      color: var(--text);
      font: 700 12px/1 "Segoe UI", system-ui, sans-serif;
    }

    .bar {
      height: 9px;
      overflow: hidden;
      border-radius: 99px;
      background: #11161b;
      border: 1px solid var(--line);
    }

    .bar i {
      display: block;
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--amber));
      transition: width .18s ease;
    }

    @media (max-width: 820px) {
      body {
        padding: 12px;
      }

      .shell {
        grid-template-columns: 1fr;
      }

      .game-frame {
        min-height: auto;
      }

      .side {
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="game-frame" aria-label="ゲーム画面">
      <canvas id="game" width="800" height="600"></canvas>
      <div class="overlay" id="overlay">
        <div class="start-panel">
          <h1>Neon Breaker</h1>
          <p class="lead" id="message">バーでボールを打ち返して、全ブロックを壊そう。</p>
          <button id="startButton" type="button">ゲーム開始</button>
        </div>
      </div>
    </section>

    <aside class="side" aria-label="ステータス">
      <div class="brand">
        <strong>Neon Breaker</strong>
        <button id="pauseButton" type="button" title="一時停止">停止</button>
      </div>
      <div class="status">
        <div class="stat"><span>Score</span><b id="score">0</b></div>
        <div class="stat"><span>Lives</span><b id="lives">3</b></div>
        <div class="stat"><span>Stage</span><b id="stage">1</b></div>
        <div class="stat"><span>Combo</span><b id="combo">0</b></div>
      </div>
      <div class="help">
        <p><kbd>←</kbd> <kbd>→</kbd> またはマウスで移動</p>
        <p><kbd>Space</kbd> で発射・一時停止</p>
        <p>青はバー拡大、緑はボール追加、赤はスピードアップ。</p>
      </div>
      <div class="bar" aria-label="ステージ進行度"><i id="progress"></i></div>
    </aside>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const message = document.getElementById("message");
    const startButton = document.getElementById("startButton");
    const pauseButton = document.getElementById("pauseButton");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const stageEl = document.getElementById("stage");
    const comboEl = document.getElementById("combo");
    const progressEl = document.getElementById("progress");

    const W = canvas.width;
    const H = canvas.height;
    const keys = new Set();
    const colors = ["#f5b84b", "#50c7d8", "#e45f67", "#71c671", "#d98ae8"];
    let state;
    let last = 0;

    function makeState() {
      return {
        running: false,
        paused: false,
        launched: false,
        score: 0,
        lives: 3,
        stage: 1,
        combo: 0,
        shake: 0,
        paddle: { x: W / 2 - 58, y: H - 48, w: 116, h: 16, speed: 520, target: null },
        balls: [],
        bricks: [],
        particles: [],
        powerups: [],
        totalBricks: 0
      };
    }

    function buildLevel() {
      const rows = Math.min(5 + state.stage, 9);
      const cols = 10;
      const gap = 8;
      const top = 74;
      const left = 45;
      const bw = (W - left * 2 - gap * (cols - 1)) / cols;
      const bh = 26;
      state.bricks = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const tough = state.stage > 2 && (r + c + state.stage) % 6 === 0;
          state.bricks.push({
            x: left + c * (bw + gap),
            y: top + r * (bh + gap),
            w: bw,
            h: bh,
            hp: tough ? 2 : 1,
            max: tough ? 2 : 1,
            color: colors[(r + c + state.stage) % colors.length]
          });
        }
      }
      state.totalBricks = state.bricks.length;
      state.powerups = [];
      attachBall();
    }

    function attachBall() {
      state.launched = false;
      state.combo = 0;
      state.balls = [{
        x: state.paddle.x + state.paddle.w / 2,
        y: state.paddle.y - 10,
        vx: 0,
        vy: 0,
        r: 8,
        speed: 390 + state.stage * 18
      }];
    }

    function startGame() {
      state = makeState();
      buildLevel();
      state.running = true;
      state.paused = false;
      overlay.classList.add("hidden");
      syncUi();
    }

    function launch() {
      if (!state.running || state.paused || state.launched) return;
      const ball = state.balls[0];
      const dir = Math.random() > .5 ? 1 : -1;
      ball.vx = dir * ball.speed * .38;
      ball.vy = -ball.speed;
      state.launched = true;
    }

    function togglePause() {
      if (!state.running) return;
      state.paused = !state.paused;
      pauseButton.textContent = state.paused ? "再開" : "停止";
      if (state.paused) {
        message.textContent = "一時停止中";
        startButton.textContent = "再開";
        overlay.classList.remove("hidden");
      } else {
        overlay.classList.add("hidden");
      }
    }

    function addParticles(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 70 + Math.random() * 180;
        state.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .45, color });
      }
    }

    function dropPowerup(brick) {
      if (Math.random() > .18) return;
      const types = ["wide", "multi", "fast"];
      const type = types[Math.floor(Math.random() * types.length)];
      state.powerups.push({
        type,
        x: brick.x + brick.w / 2 - 10,
        y: brick.y + brick.h / 2,
        w: 20,
        h: 20,
        vy: 112,
        color: type === "wide" ? "#50c7d8" : type === "multi" ? "#71c671" : "#e45f67"
      });
    }

    function applyPowerup(type) {
      if (type === "wide") {
        state.paddle.w = Math.min(176, state.paddle.w + 24);
      }
      if (type === "multi") {
        const clones = state.balls.slice(0, 2).map((b, index) => ({
          ...b,
          vx: (index ? -1 : 1) * Math.max(180, Math.abs(b.vx) || b.speed * .45),
          vy: -Math.abs(b.vy || b.speed)
        }));
        state.balls.push(...clones);
        state.launched = true;
      }
      if (type === "fast") {
        state.balls.forEach((b) => {
          b.vx *= 1.12;
          b.vy *= 1.12;
        });
      }
    }

    function rectHit(ball, rect) {
      return ball.x + ball.r > rect.x &&
        ball.x - ball.r < rect.x + rect.w &&
        ball.y + ball.r > rect.y &&
        ball.y - ball.r < rect.y + rect.h;
    }

    function update(dt) {
      if (!state.running || state.paused) return;

      const p = state.paddle;
      if (keys.has("ArrowLeft")) p.x -= p.speed * dt;
      if (keys.has("ArrowRight")) p.x += p.speed * dt;
      if (p.target !== null) p.x += (p.target - p.x - p.w / 2) * Math.min(1, dt * 12);
      p.x = Math.max(12, Math.min(W - p.w - 12, p.x));

      if (!state.launched) {
        state.balls[0].x = p.x + p.w / 2;
        state.balls[0].y = p.y - 10;
      }

      for (const ball of state.balls) {
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        if (ball.x < ball.r) {
          ball.x = ball.r;
          ball.vx *= -1;
        }
        if (ball.x > W - ball.r) {
          ball.x = W - ball.r;
          ball.vx *= -1;
        }
        if (ball.y < ball.r) {
          ball.y = ball.r;
          ball.vy *= -1;
        }

        if (ball.vy > 0 && rectHit(ball, p)) {
          const t = (ball.x - (p.x + p.w / 2)) / (p.w / 2);
          const speed = Math.hypot(ball.vx, ball.vy) * 1.006;
          ball.vx = t * speed * .82;
          ball.vy = -Math.sqrt(Math.max(0, speed * speed - ball.vx * ball.vx));
          ball.y = p.y - ball.r - 1;
          state.combo = 0;
        }

        for (let i = state.bricks.length - 1; i >= 0; i--) {
          const b = state.bricks[i];
          if (!rectHit(ball, b)) continue;
          const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
          const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
          if (overlapX < overlapY) ball.vx *= -1;
          else ball.vy *= -1;
          b.hp -= 1;
          state.combo += 1;
          state.score += 80 + state.combo * 12 + state.stage * 10;
          state.shake = .08;
          addParticles(ball.x, ball.y, b.color, 9);
          if (b.hp <= 0) {
            dropPowerup(b);
            state.bricks.splice(i, 1);
          }
          break;
        }
      }

      state.balls = state.balls.filter((b) => b.y < H + 40);
      if (state.balls.length === 0) {
        state.lives -= 1;
        state.paddle.w = Math.max(104, state.paddle.w - 10);
        if (state.lives <= 0) return finish("ゲームオーバー", "もう一度");
        attachBall();
      }

      for (let i = state.powerups.length - 1; i >= 0; i--) {
        const u = state.powerups[i];
        u.y += u.vy * dt;
        if (u.y < p.y + p.h && u.y + u.h > p.y && u.x < p.x + p.w && u.x + u.w > p.x) {
          applyPowerup(u.type);
          addParticles(u.x + u.w / 2, u.y + u.h / 2, u.color, 18);
          state.score += 120;
          state.powerups.splice(i, 1);
        } else if (u.y > H + 30) {
          state.powerups.splice(i, 1);
        }
      }

      state.particles = state.particles.filter((pt) => {
        pt.life -= dt;
        pt.x += pt.vx * dt;
        pt.y += pt.vy * dt;
        pt.vy += 250 * dt;
        return pt.life > 0;
      });

      if (state.bricks.length === 0) {
        state.stage += 1;
        state.score += 700 + state.lives * 150;
        state.paddle.w = 116;
        buildLevel();
      }

      state.shake = Math.max(0, state.shake - dt);
      syncUi();
    }

    function finish(text, buttonText) {
      state.running = false;
      state.paused = false;
      message.textContent = `${text}  Score ${state.score}`;
      startButton.textContent = buttonText;
      pauseButton.textContent = "停止";
      overlay.classList.remove("hidden");
      syncUi();
    }

    function syncUi() {
      scoreEl.textContent = state.score;
      livesEl.textContent = state.lives;
      stageEl.textContent = state.stage;
      comboEl.textContent = state.combo;
      const cleared = state.totalBricks ? state.totalBricks - state.bricks.length : 0;
      progressEl.style.width = `${Math.round((cleared / Math.max(1, state.totalBricks)) * 100)}%`;
    }

    function drawBackground() {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#101820");
      g.addColorStop(.62, "#0d1015");
      g.addColorStop(1, "#161411");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = "rgba(255,255,255,.055)";
      ctx.lineWidth = 1;
      for (let x = 0; x <= W; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x - 80, H);
        ctx.stroke();
      }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
      ctx.stroke();
    }

    function draw() {
      ctx.save();
      const jitter = state.shake ? Math.sin(performance.now() * .08) * state.shake * 18 : 0;
      ctx.translate(jitter, 0);
      drawBackground();

      for (const b of state.bricks) {
        ctx.fillStyle = b.hp < b.max ? "#f3f1cf" : b.color;
        ctx.strokeStyle = "rgba(255,255,255,.3)";
        ctx.lineWidth = 1.5;
        roundRect(b.x, b.y, b.w, b.h, 5);
        ctx.fillStyle = "rgba(255,255,255,.2)";
        ctx.fillRect(b.x + 6, b.y + 5, b.w - 12, 3);
      }

      for (const u of state.powerups) {
        ctx.fillStyle = u.color;
        ctx.strokeStyle = "rgba(255,255,255,.45)";
        ctx.lineWidth = 2;
        roundRect(u.x, u.y, u.w, u.h, 5);
        ctx.fillStyle = "#101316";
        ctx.font = "700 13px Segoe UI";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(u.type === "wide" ? "W" : u.type === "multi" ? "M" : "S", u.x + 10, u.y + 11);
      }

      const p = state.paddle;
      const pg = ctx.createLinearGradient(p.x, p.y, p.x + p.w, p.y);
      pg.addColorStop(0, "#50c7d8");
      pg.addColorStop(.5, "#f5b84b");
      pg.addColorStop(1, "#e45f67");
      ctx.fillStyle = pg;
      ctx.strokeStyle = "rgba(255,255,255,.65)";
      ctx.lineWidth = 2;
      roundRect(p.x, p.y, p.w, p.h, 8);

      for (const ball of state.balls) {
        ctx.beginPath();
        ctx.fillStyle = "#f7fbff";
        ctx.shadowColor = "#50c7d8";
        ctx.shadowBlur = 18;
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      for (const pt of state.particles) {
        ctx.globalAlpha = Math.max(0, pt.life / .45);
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x, pt.y, 3, 3);
      }
      ctx.globalAlpha = 1;

      if (!state.launched && state.running) {
        ctx.fillStyle = "rgba(238,244,247,.78)";
        ctx.font = "700 18px Segoe UI";
        ctx.textAlign = "center";
        ctx.fillText("Space / クリックで発射", W / 2, H - 92);
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }

    function loop(t) {
      const dt = Math.min(.032, (t - last) / 1000 || 0);
      last = t;
      update(dt);
      draw();
    }

    window.addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();
        if (!state.running) startGame();
        else if (!state.launched) launch();
        else togglePause();
      }
      keys.add(event.code);
    });

    window.addEventListener("keyup", (event) => keys.delete(event.code));

    canvas.addEventListener("pointermove", (event) => {
      const rect = canvas.getBoundingClientRect();
      const scale = W / rect.width;
      state.paddle.target = (event.clientX - rect.left) * scale;
    });

    canvas.addEventListener("pointerdown", () => {
      if (!state.running) startGame();
      else launch();
    });

    startButton.addEventListener("click", () => {
      if (state.running && state.paused) togglePause();
      else startGame();
    });

    pauseButton.addEventListener("click", togglePause);

    state = makeState();
    buildLevel();
    syncUi();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
